<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在进行安全验证</title>
    <style>
      :root {
        color-scheme: light dark;
        --card: rgba(255, 255, 255, 0.72);
        --text: #0f172a;
        --muted: rgba(15, 23, 42, 0.66);
        --border: rgba(255, 255, 255, 0.36);
        --accent: #3b82f6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card: rgba(15, 23, 42, 0.62);
          --text: #f8fafc;
          --muted: rgba(248, 250, 252, 0.68);
          --border: rgba(255, 255, 255, 0.14);
        }
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: #0f172a;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -24px;
        background: linear-gradient(rgba(255,255,255,0.12), rgba(255,255,255,0.12)), url("/bg.jpg") center / cover no-repeat;
        filter: blur(6px);
        transform: scale(1.06);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 25% 20%, rgba(59, 130, 246, 0.35), transparent 34%),
          radial-gradient(circle at 76% 70%, rgba(34, 197, 94, 0.22), transparent 36%),
          rgba(255, 255, 255, 0.18);
      }

      .wrap {
        position: relative;
        z-index: 1;
        width: min(100%, 720px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 28px 90px rgba(2, 8, 23, 0.28);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        padding: clamp(28px, 5vw, 52px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }

      .logo {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        color: white;
        font-weight: 900;
        background: linear-gradient(135deg, #2563eb, #22c55e);
        box-shadow: 0 14px 34px rgba(37, 99, 235, 0.34);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
        letter-spacing: -0.04em;
        line-height: 1.05;
      }

      h2 {
        margin: 0 0 12px;
        font-size: clamp(22px, 4vw, 32px);
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.8;
      }

      .challenge-box {
        margin-top: 28px;
        min-height: 86px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.46);
      }

      .hint {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .pulse {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.55);
        animation: pulse 1.6s infinite;
      }

      @keyframes pulse {
        70% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); }
        100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <div class="logo">加</div>
        <h1>加钱道人监控面板</h1>
      </div>
      <h2>正在进行安全验证</h2>
      <p>本站正在确认访问者是真人，以保护监控面板免受恶意自动程序影响。验证通过后，将自动进入页面。</p>
      <div class="challenge-box">
        <!-- Cloudflare / Turnstile 验证组件会显示在这里。 -->
        ::CAPTCHA_BOX::
      </div>
      <div class="hint"><span class="pulse"></span>验证通常只需要几秒钟，请不要关闭页面。</div>
    </main>
  </body>
</html>
